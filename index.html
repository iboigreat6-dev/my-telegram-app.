<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Telegram Mini App</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 85%;
      max-width: 400px;
      text-align: center;
      background: #1f2937;
      padding: 30px 20px;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #9ca3af;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background: #229ed9;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
  </style>
</head>

<body>
<div class="box">
    <h1>Welcome 👋</h1>
    <p>Welcome to my Telegram Mini App.</p>

    <button onclick="openApp()">Continue</button>

    <div id="message"></div>
</div>

<script>
    // Initialize Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.expand(); // Expands the mini app to full screen

    function openApp() {
        const user = tg.initDataUnsafe?.user;
        const userName = user ? user.first_name : "User";
        
        document.getElementById("message").textContent = 
            `Access granted ✅ Welcome, ${userName}!`;
    }
</script>
</body>
</html>
